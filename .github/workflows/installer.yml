name: installer

# Why this exists: every installer so far was built by hand on one machine, so a fix that landed
# in the repository reached nobody until someone remembered to rebuild — and several did not. Now
# every push builds the installer the same way tools/build.ps1 does on a desk, tests included, and
# a tag publishes it.
#
# A pushed tag v<version> — or a manual run given one in `release`, which creates the tag on the
# commit it built — publishes a stable release for numeric tags, with the installer and its checksum attached,
# described by docs/releases/v<version>.md with the SHA-256 appended. Without that file the release
# stays a draft: nothing goes out under the project's name with notes nobody wrote.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish this build as the given tag, e.g. v0.2.6 (empty: build only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The service's own go.mod names the version, so the toolchain that builds the installer
      # is the one the tests were written against. build.ps1 sets GOTOOLCHAIN=local, so Go cannot
      # quietly switch to another one behind this step.
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum

      - uses: gradle/actions/setup-gradle@v4

      - name: Wintun and Inno Setup
        shell: pwsh
        run: ./tools/bootstrap.ps1

      - name: Tests, service, application, installer
        shell: pwsh
        run: ./tools/build.ps1 -GoExe (Get-Command go).Source

      - name: Checksum
        id: checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/*setup.exe | Select-Object -First 1
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii "dist/$($installer.Name).sha256"
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          Write-Output "$hash  $($installer.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.checksum.outputs.name }}
          path: dist/*
          if-no-files-found: error

  # The tunnel service has run on Linux and macOS since 0.3.0, and these jobs build the same
  # product for the same tag: JVM tests (Xvfb lends Linux a display for the tray's real windows),
  # the service compiled for the host, and the packages. No code is signed anywhere in this
  # repository — the release notes say so where someone will actually read it.
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, service, packages
        run: ./tools/build-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version-file: service/go.mod
          cache-dependency-path: service/go.sum
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, service, packages
        run: ./tools/build-unix.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release, 'v')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out first: checkout cleans the workspace, and the installer lands in it next.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            cp "$notes" release-notes.md
            draft=""
          else
            echo "Собрано из $GITHUB_SHA. Описание допишет автор." > release-notes.md
            draft="--draft"
          fi
          # Every package from every job carries its own checksum file; all of them go into the
          # notes, each beside the name it answers for. Written on Windows: CRLF tolerated.
          printf '\n### Проверка файлов\n\n```\n' >> release-notes.md
          for f in dist/*.sha256; do
            hash=$(tr -d '\r' < "$f" | cut -d' ' -f1)
            printf 'SHA-256  %s  %s\n' "$hash" "$(basename "$f" .sha256)"
          done | sort -k3 >> release-notes.md
          printf '```\n\nВсе сборки распространяются без кодовой подписи. macOS при первом запуске спросит Gatekeeper — правый клик по приложению → «Открыть». Служба туннеля устанавливается при первом подключении и попросит пароль администратора.\n' >> release-notes.md
          # --target names the commit that was built; it creates the tag when a manual run
          # asked for one, and agrees with it when the run came from the tag itself.
          release_flags=(--prerelease)
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_flags=(--prerelease=false --latest)
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            $draft "${release_flags[@]}" \
            --title "Yumi Desktop $version" \
            --notes-file release-notes.md
